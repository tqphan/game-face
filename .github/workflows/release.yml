name: Release

# Release builds only. Every build here is signed with the project's self-signed
# certificate ("game-face self-signed", a password-protected PFX), and the Windows
# exe carries the uiAccess manifest. On Windows the exe, the Inno Setup installer
# and its uninstaller are all signed. Development builds never go through this
# workflow.
#
# Requires repository secrets (see packaging/signing/README.md):
#   SIGNING_CERT_PFX_BASE64, SIGNING_CERT_PASSWORD
#
# `cmake --install` stages each app with libmediapipe, the face model and the
# Qt libraries, plugins and QML modules it needs (see app/ui/CMakeLists.txt).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.10.1'
  TIMESTAMP_URL: http://timestamp.digicert.com
  CERT_NAME: game-face self-signed

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Opens the PFX with its password up front, so a wrong secret or the wrong
      # certificate fails the job before the build.
      - name: Load signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            throw 'SIGNING_CERT_PFX_BASE64 and SIGNING_CERT_PASSWORD are required for release builds.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:PFX_PASSWORD)
          $name = $cert.GetNameInfo('SimpleName', $false)
          if ($name -ne $env:CERT_NAME) {
            throw "The signing certificate is '$name', expected '$env:CERT_NAME' (scripts/signing/create-signing-cert.sh)."
          }
          if (-not $cert.HasPrivateKey) { throw 'The PFX has no private key.' }
          [IO.File]::WriteAllBytes('game-face-codesign.cer', $cert.Export('Cert'))
          # Trusted on this throwaway runner only, so `signtool verify` can check the chain.
          Import-Certificate -FilePath game-face-codesign.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          "SIGNING_PFX=$pfx" >> $env:GITHUB_ENV
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Stage
        shell: pwsh
        run: |
          cmake --install build --prefix "${{ github.workspace }}/dist"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify uiAccess manifest
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'embedded.manifest'
          mt.exe -nologo '-inputresource:dist\bin\game-face.exe;#1' "-out:$out"
          if ($LASTEXITCODE) { throw 'Could not extract the embedded manifest.' }
          Get-Content $out
          if (-not (Select-String -Path $out -Pattern 'uiAccess=["'']true["'']' -Quiet)) {
            throw 'Release manifest must set uiAccess="true" (see cmake/WindowsUiAccess.cmake).'
          }

      - name: Sign executable
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          packaging\windows\sign.ps1 dist\bin\game-face.exe
          signtool verify /pa /v dist\bin\game-face.exe
          if ($LASTEXITCODE) { throw 'signtool verify failed.' }

      # No zip: a uiAccess exe only starts from Program Files, so the installer is
      # the one supported way to install on Windows.
      - name: Build and sign installer
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $version = (Select-String -Path build\CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.+)$').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match the project version $version in CMakeLists.txt."
          }

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { throw 'Could not install Inno Setup.' }
          }

          $ws = $env:GITHUB_WORKSPACE
          $sign = Join-Path $ws 'packaging\windows\sign.ps1'
          & $iscc /Qp "/DAppVersion=$version" "/DDistDir=$ws\dist" "/DOutputDir=$ws" `
            "/DCertFile=$ws\game-face-codesign.cer" "/DCertThumbprint=$env:CERT_THUMBPRINT" `
            /DSign "/Sgfsign=pwsh -NoProfile -File `$q$sign`$q `$f" `
            packaging\windows\game-face.iss
          if ($LASTEXITCODE) { throw 'ISCC failed.' }

          signtool verify /pa /v game-face-windows-setup.exe
          if ($LASTEXITCODE) { throw 'signtool verify failed on the installer.' }

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'signing.pfx') -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            game-face-windows-setup.exe
            game-face-codesign.cer

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$PFX_BASE64" ] || [ -z "$PFX_PASSWORD" ]; then
            echo "::error::SIGNING_CERT_PFX_BASE64 and SIGNING_CERT_PASSWORD are required for release builds."
            exit 1
          fi

      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          cmake --build build

      - name: Stage
        run: cmake --install build --prefix "${{ github.workspace }}/dist"

      - name: Sign
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          app=dist/game-face.app
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw="$(openssl rand -hex 16)"
          p12="$RUNNER_TEMP/signing.p12"

          printf '%s' "$PFX_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$p12" -k "$kc" -P "$PFX_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          # A self-signed identity is only listed as valid for codesigning once trusted.
          openssl pkcs12 -in "$p12" -clcerts -nokeys -passin env:PFX_PASSWORD -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$p12"

          identity="$(security find-identity -v -p codesigning "$kc" | awk 'NR==1 {print $2}')"
          if ! [[ "$identity" =~ ^[0-9A-F]{40}$ ]]; then
            security find-identity -v -p codesigning "$kc"
            echo "::error::No valid code-signing identity in the imported certificate."
            exit 1
          fi

          # Sign nested frameworks and plugins first, then re-sign the bundle with entitlements.
          # Self-signed certs can't use Apple's timestamp server, hence --timestamp=none.
          codesign --force --deep --options runtime --timestamp=none --sign "$identity" "$app"
          codesign --force --options runtime --timestamp=none \
            --entitlements packaging/macos/game-face.entitlements --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true

      - name: Package
        run: ditto -c -k --keepParent dist/game-face.app game-face-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: game-face-macos.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$PFX_BASE64" ] || [ -z "$PFX_PASSWORD" ]; then
            echo "::error::SIGNING_CERT_PFX_BASE64 and SIGNING_CERT_PASSWORD are required for release builds."
            exit 1
          fi

      - uses: lukka/get-cmake@latest
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libegl-dev libxkbcommon-dev libvulkan-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          cmake --build build

      - name: Stage
        run: cmake --install build --prefix "${{ github.workspace }}/dist"

      # Linux has no OS-level executable signing; publish a detached CMS signature
      # made with the same certificate (verify command in packaging/signing/README.md).
      - name: Sign
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/signing.p12"
          pem="$RUNNER_TEMP/signing.pem"
          printf '%s' "$PFX_BASE64" | base64 --decode > "$p12"
          trap 'rm -f "$p12" "$pem"' EXIT
          (umask 077; openssl pkcs12 -in "$p12" -nodes -passin env:PFX_PASSWORD -out "$pem")
          openssl pkcs12 -in "$p12" -clcerts -nokeys -passin env:PFX_PASSWORD -out "$RUNNER_TEMP/cert.pem"

          openssl cms -sign -binary -in dist/bin/game-face -signer "$pem" -outform DER -out dist/bin/game-face.p7s
          openssl cms -verify -binary -inform DER -in dist/bin/game-face.p7s -content dist/bin/game-face \
            -CAfile "$RUNNER_TEMP/cert.pem" -purpose any -out /dev/null

      - name: Package
        run: tar -czf game-face-linux.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: game-face-linux.tar.gz

  publish:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/game-face-windows-setup.exe
            artifacts/game-face-macos.zip
            artifacts/game-face-linux.tar.gz
            artifacts/game-face-codesign.cer
