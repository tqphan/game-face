name: CI

# Builds the Qt app on every platform and runs the tests. No test opens a
# camera: face tracking runs on rendered and transformed images
# (docs/head-mouse-plan.md, section 8). Input is recorded as text, except in
# the Windows-only ci-injection test, which moves this machine's pointer.
# Release packaging is in release.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.10.1'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
          # GCC 13; the 22.04 image's GCC 11 has no std::expected.
          - name: Linux
            os: ubuntu-24.04
          # arm64 only: MediaPipe ships no x86_64 macOS library.
          - name: macOS
            os: macos-15
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Linux'
        name: System packages
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libegl-dev libxkbcommon-dev libvulkan-dev gdb
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      - name: Cache MediaPipe
        uses: actions/cache@v4
        with:
          path: build/_deps/mediapipe-*
          key: mediapipe-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/FetchMediaPipe.cmake') }}

      - name: Cache test assets
        uses: actions/cache@v4
        with:
          path: build/_deps/test-assets
          key: test-assets-${{ hashFiles('cmake/FetchTestAssets.cmake') }}

      - name: Configure
        # No uiAccess manifest: Windows won't start an unsigned uiAccess exe in
        # place, and app_smoke runs it. release.yml builds with it.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DGAME_FACE_UIACCESS=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -L "core|tracking|qml|headmouse-e2e" --output-on-failure

      # Real SendInput moves, read back with GetCursorPos; also measures
      # "Enhance pointer precision". Never run this on a machine someone uses.
      - name: Test real pointer movement
        if: runner.os == 'Windows'
        env:
          GAME_FACE_CI_INJECTION: '1'
        run: ctest --test-dir build -L ci-injection --output-on-failure -V

      # How the head mouse feels, in numbers, kept with each run.
      - name: Head mouse bench
        shell: bash
        run: |
          bench=build/tools/head-mouse-bench/head-mouse-bench
          $bench --csv bench-noise-1.csv
          $bench --noise 3 --csv bench-noise-3.csv

      - uses: actions/upload-artifact@v4
        with:
          name: head-mouse-bench-${{ runner.os }}
          path: bench-noise-*.csv

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/dist"
